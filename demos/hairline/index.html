<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hairline — Coiffeur à Courbevoie (maquette)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0E0E0E;   /* le noir de leur enseigne */
    --steel:#6E6D69;   /* le béton du salon */
    --mist:#E8E7E4;
    --paper:#F6F6F4;
    --brass:#FFFFFF;   /* la lumière LED des lettres */
    --ink:#0E0E0E;
    --rule:#D6D4CF;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .demo{background:var(--mist);color:var(--night);font-size:13px;text-align:center;padding:7px 16px;font-weight:600}

  /* En-tête */
  header{position:absolute;left:0;right:0;top:var(--bh,34px);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(16px,4vw,48px);color:var(--paper);z-index:3}
  .mark{font-stretch:125%;font-weight:800;letter-spacing:.02em;font-size:15px;text-decoration:none}
  nav{display:flex;align-items:center;gap:22px;font-size:15px}
  nav a{text-decoration:none;opacity:.85}
  nav a:hover{opacity:1}
  @media (max-width:720px){nav a{display:none}}
  .lang{display:flex;gap:2px;border:1px solid rgba(245,246,247,.35);border-radius:999px;padding:3px}
  .lang button{background:none;border:0;color:var(--paper);font-weight:600;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--paper);color:var(--night)}

  /* Hero : la ligne */
  .hero{background:var(--night);color:var(--paper);min-height:min(100svh,860px);display:flex;flex-direction:column;justify-content:flex-end;padding:120px clamp(16px,4vw,48px) clamp(40px,6vw,72px);overflow:hidden}
  .title{position:relative}
  .word{margin:0;font-stretch:125%;font-weight:800;font-size:clamp(84px,16vw,250px);line-height:.84;letter-spacing:-.01em;position:relative;z-index:1}
  .line{position:absolute;left:calc(-1 * clamp(16px,4vw,48px));width:calc(100% + 2 * clamp(16px,4vw,48px));top:42%;height:clamp(60px,9vw,120px);z-index:2;pointer-events:none}
  .line path{fill:none;stroke:var(--brass);stroke-width:2;filter:drop-shadow(0 0 5px rgba(255,255,255,.85));stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.8s .3s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .hero-foot{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:clamp(28px,4vw,48px)}
  .hero-foot p{margin:0;max-width:34ch;font-size:clamp(17px,1.6vw,20px);color:var(--mist)}
  .rating{font-stretch:75%;font-size:15px;margin-top:10px!important}
  .rating b{color:var(--brass);font-weight:700}
  .btn{display:inline-block;background:var(--brass);color:var(--night);text-decoration:none;font-weight:700;padding:16px 26px;border-radius:999px;white-space:nowrap;border:0;cursor:pointer}
  .btn:hover{background:#DCDCDA}
  .btn[hidden],[hidden]{display:none}
  .btn:disabled{background:var(--rule);color:var(--steel);cursor:not-allowed}
  @media (max-width:640px){.hero{min-height:auto;padding-top:150px}.word{font-size:27vw}.hero-foot{grid-template-columns:1fr}.hero-foot .btn{text-align:center}}
  @media (prefers-reduced-motion:reduce){.line path{animation:none;stroke-dashoffset:0}}

  .city{margin:14px 0 0;font-stretch:125%;font-weight:600;letter-spacing:.55em;font-size:clamp(15px,1.8vw,26px);color:var(--mist);position:relative;z-index:1}
  /* Sections */
  section{padding:clamp(56px,8vw,104px) clamp(16px,4vw,48px)}
  .wrap{max-width:1080px;margin:0 auto}
  h2{font-stretch:125%;font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.05;margin:0 0 28px;letter-spacing:-.01em}
  .two{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,5vw,72px)}
  @media (max-width:760px){.two{grid-template-columns:1fr}}

  /* Tarifs */
  .menu{list-style:none;margin:0;padding:0}
  .menu li{display:flex;align-items:baseline;gap:12px;padding:18px 0;border-bottom:1px solid var(--rule);font-size:19px}
  .menu li .n{font-weight:600}
  .menu li .d{color:var(--steel);font-size:14px;font-stretch:75%}
  .menu li i{flex:1;border-bottom:1px dotted var(--steel);transform:translateY(-5px)}
  .menu li .p{font-weight:700;font-stretch:75%;font-size:20px}

  #tarifs .chip{border-color:var(--rule);color:var(--ink)}
  #tarifs .chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--paper)}
  .catnote{color:var(--steel);font-size:15px;margin:16px 0 0}
  .menu li .n em{display:block;font-style:normal;font-weight:400;color:var(--steel);font-size:14px}
  .menu li .p{white-space:nowrap}
  @media (max-width:520px){.menu li{flex-wrap:wrap}.menu li i{display:none}.menu li .d{order:3;width:100%}.menu li .p{margin-left:auto}}
  .chips.svc{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(245,246,247,.18)}
  /* Réservation */
  .book{background:var(--night);color:var(--paper)}
  .book h2{color:var(--paper)}
  .book .intro{color:var(--mist);margin:0 0 8px;max-width:34ch}
  .step{border-top:1px solid rgba(245,246,247,.18);padding:22px 0}
  .step h3{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--mist)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:none;border:1px solid rgba(245,246,247,.3);color:var(--paper);border-radius:999px;padding:10px 16px;cursor:pointer;font-size:15px}
  .chip small{color:var(--mist);opacity:.75;margin-left:6px}
  .chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--night)}
  .chip[aria-pressed="true"] small{color:var(--night)}
  .chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
  .days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .days .chip{border-radius:14px;padding:10px 4px;text-align:center;line-height:1.2}
  .days .chip b{display:block;font-size:20px;font-stretch:125%}
  @media (max-width:520px){.days{grid-template-columns:repeat(3,1fr)}}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .slots .chip{border-radius:10px;padding:9px 0;text-align:center}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.fields{grid-template-columns:1fr}}
  label{display:block;font-size:14px;color:var(--mist);margin-bottom:6px}
  input{width:100%;background:transparent;border:1px solid rgba(245,246,247,.3);border-radius:10px;padding:13px 14px;color:var(--paper);font:inherit}
  input::placeholder{color:rgba(230,234,237,.45)}
  .summary{margin:22px 0 16px;color:var(--mist);min-height:1.5em}
  .summary b{color:var(--paper)}
  .done{border:1px solid var(--brass);border-radius:14px;padding:22px;margin-top:8px}
  .done h3{margin:0 0 6px;font-stretch:125%;font-size:22px}
  .done p{margin:0;color:var(--mist)}

  /* Galerie */
  .gallery{display:grid;gap:10px;max-width:1150px}
  .gallery figure{margin:0;overflow:hidden;background:var(--night);aspect-ratio:1150/297}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block}
  @media (max-width:640px){.gallery figure{aspect-ratio:4/3}}
  .scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0 0;padding:0;list-style:none}
  .scores li{border-top:2px solid var(--night);padding-top:10px;font-size:14px;color:var(--steel)}
  .scores b{display:block;font-stretch:125%;font-size:28px;color:var(--ink)}
  @media (max-width:520px){.scores{grid-template-columns:repeat(2,1fr)}}
  .team{display:flex;flex-wrap:wrap;gap:14px 22px;margin:22px 0 0;padding:0;list-style:none}
  .team li{display:flex;align-items:center;gap:10px;font-weight:600}
  .team span{width:38px;height:38px;border-radius:50%;background:var(--night);color:var(--paper);display:grid;place-items:center;font-stretch:125%;font-size:14px}
  .salon h3{margin:36px 0 0;font-size:15px;font-weight:600;color:var(--steel)}

  .salon{background:var(--mist)}
  .salon p.big{font-size:clamp(20px,2.2vw,26px);line-height:1.4;max-width:28ch;margin:0 0 18px}
  .salon p{color:var(--steel);max-width:52ch;margin:0 0 14px}

  .info dl{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;margin:0;font-size:18px}
  .info dt{color:var(--steel)}
  .info dd{margin:0}
  .info .links{display:flex;flex-wrap:wrap;gap:20px;margin-top:24px;font-weight:600}

  footer{background:var(--night);color:var(--mist);padding:40px clamp(16px,4vw,48px);font-size:14px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
  footer strong{font-stretch:125%;color:var(--paper)}
</style>
</head>
<body>

<div class="demo" data-t="demo"></div>

<header>
  <a class="mark" href="#">HAIRLINE</a>
  <nav>
    <a href="#tarifs" data-t="navPrices"></a>
    <a href="#reserver" data-t="navBook"></a>
    <a href="#infos" data-t="navInfo"></a>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main>
  <section class="hero" aria-label="Hairline">
    <div class="title">
      <svg class="line" viewBox="0 0 1600 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 96 C 260 96, 360 30, 620 30 S 980 78, 1180 60 S 1460 22, 1600 24"/>
      </svg>
      <h1 class="word">Hair<br>line</h1>
      <p class="city" aria-hidden="true">PARIS</p>
    </div>
    <div class="hero-foot">
      <div>
        <p data-t="lead"></p>
        <p class="rating"><b>4,9</b> <span data-t="rating"></span></p>
      </div>
      <a class="btn" href="#reserver" data-t="ctaBook"></a>
    </div>
  </section>

  <section id="tarifs">
    <div class="wrap two">
      <h2 data-t="pricesTitle"></h2>
      <div>
        <div class="chips cats" id="cats"></div>
        <p class="catnote" id="catnote"></p>
        <ul class="menu" id="menu"></ul>
      </div>
    </div>
  </section>

  <section class="book" id="reserver">
    <div class="wrap two">
      <div>
        <h2 data-t="bookTitle"></h2>
        <p class="intro" data-t="bookIntro"></p>
      </div>
      <form id="form" novalidate>
        <div class="step"><h3 data-t="step1"></h3><div class="chips cats" id="bcats"></div><div class="chips svc" id="services"></div></div>
        <div class="step"><h3 data-t="stepWho"></h3><div class="chips" id="who"></div></div>
        <div class="step"><h3 data-t="step2"></h3><div class="days" id="days"></div></div>
        <div class="step"><h3 data-t="step3"></h3><div class="slots" id="slots"></div></div>
        <div class="step">
          <h3 data-t="step4"></h3>
          <div class="fields">
            <div><label for="name" data-t="name"></label><input id="name" autocomplete="name"></div>
            <div><label for="tel" data-t="phone"></label><input id="tel" type="tel" autocomplete="tel"></div>
          </div>
          <p class="summary" id="summary" aria-live="polite"></p>
          <button class="btn" id="confirm" type="submit" disabled data-t="confirm"></button>
          <div class="done" id="done" hidden><h3 data-t="doneTitle"></h3><p id="doneText"></p></div>
        </div>
      </form>
    </div>
  </section>

  <section class="salon">
    <div class="wrap two">
      <h2 data-t="salonTitle"></h2>
      <div>
        <p class="big" data-t="salon1"></p>
        <p data-t="salon2"></p>
        <ul class="scores">
          <li><b>4,9</b><span data-t="sc1"></span></li><li><b>4,9</b><span data-t="sc2"></span></li><li><b>4,9</b><span data-t="sc3"></span></li><li><b>4,9</b><span data-t="sc4"></span></li>
        </ul>
        <h3 data-t="teamTitle"></h3>
        <ul class="team" id="team"></ul>
      </div>
    </div>
  </section>

  <section aria-label="Photos">
    <div class="wrap gallery">

  const c=C[cat];
  $("catnote").textContent=c.note?c.note[lang]:""; $("catnote").hidden=!c.note;
  $("menu").innerHTML=c.items.map(i=>`<li><span class="n">${i[lang]}${i.d?`<em>${i.d[lang]}</em>`:""}</span><span class="d">${i.m}</span><i></i><span class="p">${price(i)}</span></li>`).join("");
  // Réservation
  const bc=$("bcats"); bc.innerHTML=""; C.forEach((c,i)=>bc.append(chip(c[lang],st.c===i,()=>{st.c=i;st.s=null;render()})));
  const sv=$("services"); sv.innerHTML=""; C[st.c].items.forEach((s,i)=>sv.append(chip(`${s[lang]}<small>${price(s)}</small>`,st.s===i,()=>{st.s=i;render()})));
  $("team").innerHTML=TEAM.map(n=>`<li><span>${n[0]}</span>${n}</li>`).join("");
  const wv=$("who"); wv.innerHTML=""; wv.append(chip(t.any,st.w===-1,()=>{st.w=-1;render()})); TEAM.forEach((n,i)=>wv.append(chip(n,st.w===i,()=>{st.w=i;render()})));
  const dv=$("days"); dv.innerHTML=""; days.forEach((d,i)=>dv.append(chip(`${t.wd[d.getDay()]}<b>${d.getDate()}</b>`,st.d===i,()=>{st.d=i;st.h=null;render()})));
  const hv=$("slots"); hv.innerHTML=""; hours.forEach((h,i)=>{const dis=st.d===null||taken(st.d,i); hv.append(chip(h,st.h===i,()=>{st.h=i;render()},dis))});
  const ok=st.s!==null&&st.d!==null&&st.h!==null;
  $("summary").innerHTML= ok ? t.sum(C[st.c].items[st.s][lang]+(st.w>=0?` ${t.with} ${TEAM[st.w]}`:""),fmtDay(days[st.d]),hours[st.h]) : t.pick;
  $("confirm").disabled=!ok;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render();fixBh()});
$("form").onsubmit=e=>{e.preventDefault();const t=T[lang];$("done").hidden=false;$("doneText").textContent=t.doneText(C[st.c].items[st.s][lang]+(st.w>=0?` ${t.with} ${TEAM[st.w]}`:""),fmtDay(days[st.d]),hours[st.h]);$("confirm").hidden=true;};
render();
const fixBh=()=>document.documentElement.style.setProperty("--bh",document.querySelector(".demo").offsetHeight+"px");
fixBh(); addEventListener("resize",fixBh);
</script>
</body>
</html>
